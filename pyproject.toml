[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migsafe-pg"
version = "0.1.1"
description = "Flag the PostgreSQL migration that would lock your users table before it ships."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mgkvibez" }]
keywords = ["postgres", "migrations", "sql", "database", "developer-tools", "linter"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
migsafe = "migsafe.cli:main"

[tool.setuptools]
packages = ["migsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
